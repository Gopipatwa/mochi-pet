name: Build Windows exe

# Builds Mochi.exe on every push and pull request, and publishes a GitHub Release when you push a
# version tag:   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # only used to attach the exe to a release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $conf -or $tag -ne $cargo) {
            Write-Error "Tag v$tag does not match tauri.conf.json ($conf) / Cargo.toml ($cargo). Bump both, then re-tag."
          }

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Collect the exe and a checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/mochi.exe dist/Mochi.exe
          $hash = (Get-FileHash dist/Mochi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Mochi.exe" | Out-File -Encoding ascii dist/Mochi.exe.sha256
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Mochi.exe
            dist/Mochi.exe.sha256
          generate_release_notes: true
